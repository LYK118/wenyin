<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文引｜文献管理</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#22312b;background:#f4f6f2}
*{box-sizing:border-box}
body{margin:0}
header{background:#315c4b;color:#fff;padding:22px max(20px,calc((100% - 920px)/2))}
main{max-width:920px;margin:24px auto;padding:0 16px}
.card{background:white;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 4px 16px #19392b10}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
input,select,textarea,button{font:inherit}
input[type=text],textarea,select{padding:10px;border:1px solid #ccd6cf;border-radius:8px;max-width:100%}
button{border:0;border-radius:8px;padding:10px 16px;background:#315c4b;color:white;cursor:pointer}
button.secondary{background:#e9f0eb;color:#23483b}
button:disabled{opacity:.55;cursor:wait}
.muted{color:#68766e;font-size:.92rem}
.result{white-space:pre-wrap;background:#f5f8f5;padding:12px;border-radius:8px;overflow-wrap:anywhere}
.field{display:grid;grid-template-columns:130px 1fr;gap:10px;margin:10px 0}
.field input{width:100%}
@media(max-width:600px){.field{grid-template-columns:1fr;gap:4px}}
</style>
</head>
<body>
<header>
  <h1>文引｜文献管理</h1>
  <div>识别并整理文献资料</div>
</header>

<main>
  <section class="card">
    <h2>上传文献</h2>
    <p>选择图片、PDF 或 DJVU 文件。识别结果可能有误，请对照原文核对。</p>
    <div class="row">
      <input id="file" type="file" accept="image/*,.pdf,.djvu,.djv">
      <button id="takePhoto" class="secondary" type="button">拍照识别</button>
    </div>
    <input id="camera" type="file" accept="image/*" capture="environment" hidden>
    <p class="muted">选择文件或拍照后自动载入。自动 AI 识别需要网站服务端接入获授权的 AI 服务。</p>
    <p id="status" class="muted"></p>
    <div id="preview"></div>
  </section>

  <section class="card">
    <h2>提取的信息（可编辑）</h2>
    <div class="field"><label for="authors">作者</label><input id="authors" type="text"></div>
    <div class="field"><label for="title">题名</label><input id="title" type="text"></div>
    <div class="field">
      <label for="type">文献类型</label>
      <select id="type">
        <option>期刊文章</option><option>图书</option><option>图书章节</option>
        <option>会议论文</option><option>学位论文</option><option>研究报告</option>
        <option>网页</option><option>报纸文章</option><option>其他</option>
      </select>
    </div>
    <div class="field"><label for="source">期刊/出版社/来源</label><input id="source" type="text"></div>
    <div class="field"><label for="year">年份</label><input id="year" type="text"></div>
    <div class="field"><label for="volume">卷(期)</label><input id="volume" type="text"></div>
    <div class="field"><label for="pages">页码</label><input id="pages" type="text"></div>
    <div class="field"><label for="doi">DOI</label><input id="doi" type="text"></div>
    <button id="citation" type="button">生成 GB/T 7714 引文</button>
    <div id="output" class="result" style="margin-top:12px"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);

function handleFile(file) {
  $("preview").replaceChildren();
  $("status").textContent = "";
  if (!file) return;

  const url = URL.createObjectURL(file);

  if (file.type.startsWith("image/")) {
    const img = document.createElement("img");
    img.src = url;
    img.alt = "上传图片预览";
    img.style = "max-width:100%;max-height:420px";
    $("preview").append(img);
  } else if (file.type === "application/pdf") {
    const frame = document.createElement("iframe");
    frame.src = url;
    frame.title = "PDF 预览";
    frame.style = "width:100%;height:420px;border:0";
    $("preview").append(frame);
  } else {
    $("preview").textContent =
      "已选择 " + file.name + "。DJVU 文件需先转换为 PDF 或图片后才能预览和识别。";
  }

  $("status").textContent =
    "文件已载入。当前网页没有连接后台 AI，因此尚未自动提取信息。";
}

$("file").addEventListener("change", () => handleFile($("file").files[0]));
$("takePhoto").addEventListener("click", () => $("camera").click());
$("camera").addEventListener("change", () => handleFile($("camera").files[0]));

$("citation").addEventListener("click", () => {
  const authors = $("authors").value.trim()
    .replace(/[;,，、]+/g, "; ")
    .replace(/;\s*/g, ", ");
  const title = $("title").value.trim();
  const type = $("type").value;
  const source = $("source").value.trim();
  const year = $("year").value.trim();
  const volume = $("volume").value.trim();
  const pages = $("pages").value.trim();
  const doi = $("doi").value.trim();

  const codes = {
    "期刊文章":"J", "图书":"M", "图书章节":"M", "会议论文":"C",
    "学位论文":"D", "研究报告":"R", "网页":"EB/OL",
    "报纸文章":"N", "其他":"Z"
  };
  const code = codes[type] || "Z";
  const isJournal = type === "期刊文章";
  const cleanDoi = doi
    ? (doi.startsWith("http") ? doi : "https://doi.org/" + doi).replace(/[.。]+$/, "")
    : "";

  let citation = `${authors || "作者未填写"}. ${title || "题名未填写"}[${code}]. ${source}`;
  if (isJournal && year) citation += `, ${year}`;
  if (volume) citation += `, ${volume}`;
  if (pages) citation += `: ${pages}`;
  if (!isJournal && year) citation += `. ${year}`;
  citation += cleanDoi ? `. ${cleanDoi}.` : ".";

  $("output").textContent = citation;
});
</script>
</body>
</html>
